<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 3</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f3ecff;
    color: #3b2a5e;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    transition: background 0.4s ease, color 0.4s ease;
  }

  body.dark-mode {
    background: #1b1030;
    color: #ece6ff;
  }

  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 15px 40px rgba(107, 33, 168, 0.2);
    max-width: 480px;
    width: 100%;
    padding: 36px;
    text-align: center;
    transition: background 0.4s ease, color 0.4s ease;
  }

  body.dark-mode .card {
    background: #2a1a4a;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 26px;
    color: #6a11cb;
  }

  body.dark-mode h1 {
    color: #c9a8ff;
  }

  p.subtitle {
    margin: 0 0 20px;
    font-size: 14px;
    color: #7a6a99;
  }

  body.dark-mode p.subtitle {
    color: #b6a6d9;
  }

  p.name {
    font-size: 15px;
    margin: 0 0 24px;
  }

  button {
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin: 6px;
    transition: transform 0.15s ease;
  }

  button:hover {
    transform: translateY(-2px);
  }

  #likeBtn {
    background: #6a11cb;
    color: white;
  }

  #themeBtn {
    background: #ece1ff;
    color: #6a11cb;
  }

  body.dark-mode #themeBtn {
    background: #3d2766;
    color: #ece6ff;
  }

  #counterText {
    font-size: 13px;
    color: #8a7aab;
    margin-top: 14px;
  }

  body.dark-mode #counterText {
    color: #b6a6d9;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Activity 3: HTML & Git</h1>
    <p class="subtitle">System Integration and Architecture 2 · Group 6</p>
    <p class="name">Jasmine Grace Visaya</p>

        <h1>HAVE FUN CODING!!!!😊💕</h1>

    
    
    
    <h1>
      <b>GO FOR IT!!!❤️✨</b>
    </h1>

    <button id="themeBtn">🌙 Dark Mode</button>

  </div>

<script>

  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    themeBtn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  });
</script>

</body>
</html>
